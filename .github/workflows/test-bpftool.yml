name: Test bpftool

on:
  workflow_call:
    inputs:
      download_sources:
        required: true
        type: boolean
        description: Whether to download the linux sources into the working directory.

jobs:
  test-bpftool:
    name: Test bpftool
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      BPF_NEXT_BASE_BRANCH: 'master'
      REPO_ROOT: ${{ github.workspace }}/src
    steps:
      - if: ${{ inputs.download_sources }}
        name: Download bpf-next tree
        uses: Tropicao/libbpf-ci/get-linux-source@bpftool_synctypes
        with:
          dest: ${{ env.REPO_ROOT }}
          rev: ${{ env.BPF_NEXT_BASE_BRANCH }}
      - if: ${{ ! inputs.download_sources }}
        name: Checkout ${{ github.repository }} to ./src
        uses: actions/checkout@v6
        with:
          path: 'src'
      # The tree checked out above depends on the calling repository: it is
      # bpf-next master (+ ci/diffs) for vmtest runs, and the branch under
      # review for kernel-mirror runs. State which one is being tested, both
      # to read the results below and to tell the two cases apart.
      - name: Report tested tree
        shell: bash
        run: |
          cd "${REPO_ROOT}"
          make -s kernelversion >kernelversion.txt
          if git rev-parse --git-dir >/dev/null 2>&1; then
            echo "Revision: $(git rev-parse HEAD)" >>kernelversion.txt
          else
            echo "Revision: unavailable (exported tree without .git)" >>kernelversion.txt
          fi
          cat kernelversion.txt
          echo '::notice title=Tested tree::'"$(sed 's/%/%25/g; s/\r/%0D/g' kernelversion.txt | tr '\n' ' ')"
      - name: Install bpftool build dependencies
        shell: bash
        run: |
          # libreadline is needed by tools/bpf (bpf_dbg); libelf, libcap,
          # zlib and libbfd are needed by bpftool itself; llvm provides
          # llvm-strip, used to strip the skeleton BPF objects (clang is
          # already preinstalled on the runner)
          sudo apt-get update
          sudo -E apt-get install --no-install-recommends -y \
              libelf-dev libcap-dev binutils-dev zlib1g-dev libreadline-dev llvm
      # Static cross-check of bpftool's program/map/attach type names, common
      # options, documentation and bash completion against the UAPI BPF
      # header. No build or privileged access is needed. Kept as its own step
      # so that a build failure and a documentation/type drift are reported
      # independently; the Python exit status is the verdict.
      - name: Check bpftool code, docs and bash completion are in sync
        shell: bash
        run: |
          cd "${REPO_ROOT}"
          python3 ./tools/testing/selftests/bpf/test_bpftool_synctypes.py >bpftool-sync.log 2>&1
          status=$?
          cat bpftool-sync.log
          # Diffs are printed with set() literals, which GitHub renders inside
          # backticks as ~200-character unusable lines. Attach them as an
          # annotation instead, with workspace paths made relative.
          if [[ $status -ne 0 ]]; then
            sed "s#${REPO_ROOT}/##g; s/%/%25/g; s/\r/%0D/g" bpftool-sync.log >bpftool-sync.annotation
            echo "::error file=src/tools/bpf/bpftool/main.h,title=Mismatched bpftool types/docs/completion::$(cat bpftool-sync.annotation)"
          fi
          exit $status
      - name: Test bpftool build
        shell: bash
        run: |
          cd "${REPO_ROOT}"
          bash ./tools/testing/selftests/bpf/test_bpftool_build.sh -j "$(nproc)"
