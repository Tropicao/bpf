name: Test bpftool (compatibility wrapper)

# Temporary: the base branch's test-build-commands.yml still calls
# build-bpftool.yml, and a pull_request run resolves local reusable
# workflows from the base branch, not from the pull request. Keep this file
# forwarding to the renamed workflow so the caller keeps resolving; drop it
# once the rename lands in the base branch.

on:
  workflow_call:
    inputs:
      download_sources:
        required: true
        type: boolean
        description: Whether to download the linux sources into the working directory.

jobs:
  build-bpftool:
    uses: ./.github/workflows/test-bpftool.yml
    with:
      download_sources: ${{ inputs.download_sources }}
